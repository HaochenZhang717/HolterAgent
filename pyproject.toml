[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holter-agent"
version = "0.1.0"
description = "Tool-first LLM agent for ST-segment / myocardial ischemia analysis of 24 h Holter ECG"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "wfdb>=4.1",
    "matplotlib>=3.8",  # images shown to the model (holter_agent.render)
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.8"]  # 1.8.0 verified against the request shape in tests
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["holter_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
